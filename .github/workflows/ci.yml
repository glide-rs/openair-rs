on:
  workflow_call:
  pull_request:
  push:
    branches: [master, main]

name: CI

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run check
        run: cargo check --all-features
      - name: Run tests (default features)
        run: cargo test
      - name: Run tests (with serde)
        run: cargo test --features serde
      - name: Run example
        run: cargo run --example parse_file example_data/Switzerland.txt

  clippy:
    name: Run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  rustfmt:
    name: Check code formatting
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=rust-version depName=rust
      RUST_NIGHTLY_VERSION: nightly-2026-10-31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_VERSION }}
          components: rustfmt
      - run: cargo +${{ env.RUST_NIGHTLY_VERSION }} fmt -- --check
